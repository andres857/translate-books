# Levanta todo el servicio: api (FastAPI) + worker (pipeline) + frontend (Next.js)
# + almacenamiento S3 local (SeaweedFS) con una caché Nginx delante como "CDN".
#   cp .env.example .env   # DEEPSEEK_API_KEY (o pégala después en la web)
#   docker compose up --build -d
# La llave y el modelo de DeepSeek se editan en Administración › Configuración.
x-backend: &backend
  image: traductor-backend
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: sqlite:////data/app.db
    DATA_DIR: /data
    CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
    # dentro de Docker el api habla con SeaweedFS por la red interna; las URL prefirmadas
    # se firman para el host que ve el navegador (S3_PUBLIC_ENDPOINT)
    S3_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-http://seaweedfs:8333}
    S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:${S3_PORT:-8333}}
    S3_CORS_ORIGINS: ${S3_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:${WEB_PORT:-3000}}
  volumes:
    - ./data:/data
  restart: unless-stopped

services:
  api:
    <<: *backend
    build:
      context: ./backend
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      storage-init:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: python -m app.worker
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://api:8000
    environment:
      # CSP de las páginas (frontend/proxy.ts): el navegador sube los libros con PUT directo a este origen S3
      CSP_CONNECT_SRC: ${S3_PUBLIC_ENDPOINT:-http://localhost:${S3_PORT:-8333}}
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  # Almacenamiento compatible con S3 (API en :8333). Crea el bucket al arrancar.
  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    command: mini -dir=/data -s3.config=/etc/seaweedfs/s3.json -bucket=${S3_BUCKET:-uploads}
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # sin firma el S3 responde 403: basta con que conteste HTTP
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8333/ | grep -qv '^000$$'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  # Configura el bucket (existe + CORS para subidas prefirmadas desde el navegador) y termina.
  storage-init:
    <<: *backend
    command: python -m app.storage.setup
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      seaweedfs:
        condition: service_healthy

  # "CDN" local: caché Nginx delante de SeaweedFS (solo GET/HEAD, X-Cache-Status HIT/MISS).
  cdn:
    image: nginx:1.31.8-alpine
    ports:
      - "${CDN_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/cdn.conf:/etc/nginx/conf.d/default.conf:ro
      - cdn-cache:/var/cache/nginx/cdn
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped

volumes:
  seaweedfs-data:
  cdn-cache:
