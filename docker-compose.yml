# Levanta todo el servicio: api (FastAPI) + worker (pipeline) + frontend (Next.js).
#   cp .env.example .env   # DEEPSEEK_API_KEY y/o CLAUDE_CODE_OAUTH_TOKEN (de `claude setup-token`)
#   docker compose up --build -d
# El método (suscripción de Claude o API de DeepSeek) se elige en Administración › Configuración.
x-backend: &backend
  image: traductor-backend
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: sqlite:////data/app.db
    DATA_DIR: /data
    CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
  volumes:
    - ./data:/data
  restart: unless-stopped

services:
  api:
    <<: *backend
    build:
      context: ./backend
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    <<: *backend
    command: python -m app.worker
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
