# "CDN" local: caché Nginx delante de SeaweedFS (API S3, lectura anónima).
# https://<cdn>/<bucket>/<key>  →  http://seaweedfs:8333/<bucket>/<key>
proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=cdn_cache:10m max_size=1g inactive=7d use_temp_path=off;

server {
    listen 80;
    server_name _;

    location / {
        limit_except GET HEAD { deny all; }

        proxy_pass http://seaweedfs:8333;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        # no reenviar firmas ni cookies del cliente: el origen se lee como anónimo
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";

        proxy_cache cdn_cache;
        proxy_cache_key $uri;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
