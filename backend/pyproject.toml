[project]
name = "traductor-libros"
version = "0.1.0"
description = "Traducción de libros PDF EN→ES preservando la maquetación"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24",
  "pymupdf-fonts",
  "pypdf",
  "pdfplumber",
  "pillow",
  "fonttools",
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
  "sqlalchemy>=2.0",
  "alembic",
  "pydantic-settings",
  "httpx",
  "tenacity",
  "pytesseract",
  "opencv-python-headless",
  "numpy",
  "boto3",
  "argon2-cffi",
]

[project.optional-dependencies]
dev = ["pytest", "ruff>=0.17"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: pruebas con el PDF de referencia (lentas, pueden usar la API)", "s3: integración contra el SeaweedFS local (docker compose up -d seaweedfs cdn)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# Excluidas por estilo (motivo en docs/backend-review/15-sin-lint-ni-checks.md): E501 (42 líneas > 120, sobre todo
# prompts y f-strings largas), E741 (variables `l`) y E731 (lambdas asignadas).
ignore = ["E501", "E741", "E731"]

[tool.ruff.lint.flake8-bugbear]
# Depends/File/Form/Query en los parámetros por defecto son el patrón de FastAPI, no un valor mutable compartido.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Body",
                          "fastapi.Header", "fastapi.Cookie", "fastapi.Path"]

[tool.ruff.lint.isort]
# backend/alembic/ es la carpeta de migraciones, no el paquete: sin esto ruff trata `alembic` como propio.
known-first-party = ["app"]
known-third-party = ["alembic"]
